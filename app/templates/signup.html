{% extends "base.html" %}
{% block content %}
<section class="auth-card"><p class="eyebrow">SMPilot AI</p><h1>Create your workspace</h1><p>Start running clearer, healthier sprints with Aria.</p>
{% if errors %}<div class="alert alert-danger" role="alert"><ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" action="/signup"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Full name<input type="text" name="full_name" value="{{ form.full_name|default('') if form else '' }}" autocomplete="name" required></label><label>Email<input type="email" name="email" value="{{ form.email|default('') if form else '' }}" autocomplete="email" required></label><label>Mobile <span class="muted">Optional</span><input type="tel" name="mobile" value="{{ form.mobile|default('') if form else '' }}" autocomplete="tel"></label><label>Company or organization <span class="muted">Optional</span><input type="text" name="organization_name" value="{{ form.organization_name|default('') if form else '' }}" autocomplete="organization"></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" required></label><button type="submit">Create account</button></form>
<p class="form-note">Already registered? <a href="/login">Log in</a></p></section>
{% endblock %}
