{% extends "base.html" %}
{% block content %}<section class="card settings-card"><p class="eyebrow">Account</p><h1>Your profile</h1>{% if request.query_params.get('saved') %}<div class="alert alert-info" role="status">Profile saved.</div>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Full name<input type="text" name="full_name" value="{{ user.full_name }}" required></label><label>Email<input type="email" value="{{ user.email }}" disabled></label><label>Mobile<input type="tel" name="mobile" value="{{ user.mobile or '' }}"></label><label>Company or organization<input type="text" name="organization_name" value="{{ user.organization_name or '' }}"></label><div class="button-row"><button type="submit">Save profile</button><a class="button secondary-button" href="/change-password">Change password</a></div></form><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="danger-button" type="submit">Log out</button></form></section>{% endblock %}
