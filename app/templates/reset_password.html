{% extends "base.html" %}
{% block content %}<section class="auth-card"><p class="eyebrow">Account security</p><h1>Reset password</h1>{% if errors %}<div class="alert alert-danger" role="alert"><ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>New password<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" required></label><button type="submit">Reset password</button></form></section>{% endblock %}
