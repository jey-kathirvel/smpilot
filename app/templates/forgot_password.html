{% extends "base.html" %}
{% block content %}<section class="auth-card"><p class="eyebrow">Account recovery</p><h1>Forgot password?</h1><p>Enter your account email. We will send a short-lived reset link if it matches an account.</p>{% if success %}<div class="alert alert-info" role="status">{{ success }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Email<input type="email" name="email" autocomplete="email" required></label><button type="submit">Send reset instructions</button></form><p class="form-note"><a href="/login">Back to login</a></p></section>{% endblock %}
