<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · SMPilot AI</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% if show_nav %}
  <header class="site-header">
    <a class="brand" href="/today" aria-label="SMPilot AI home"><span class="brand-mark">S</span><span>SMPilot <strong>AI</strong></span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"><span class="sr-only">Toggle navigation</span><span></span><span></span><span></span></button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
      <a class="active" href="/today">Today</a><a href="/standup">Stand-up</a><a href="/sprint">Sprint</a><a href="/backlog">Backlog</a><a href="/team">Team</a><a class="aria-link" href="/aria">Ask Aria</a><a href="/insights">Insights</a><a href="/settings/workspace">Settings</a>
    </nav>
    <div class="header-actions"><a class="icon-button notification-link" href="/notifications" aria-label="Notifications"><span aria-hidden="true">N</span><span class="notification-count" hidden>0</span></a>{% if user %}<a class="avatar" href="/profile" aria-label="User profile">{{ user.full_name[:2]|upper }}</a>{% else %}<span class="avatar" aria-label="User profile">SP</span>{% endif %}</div>
  </header>
  {% endif %}
  <main id="main-content" class="{% if show_nav %}app-shell{% else %}page-shell{% endif %}">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</body>
</html>
