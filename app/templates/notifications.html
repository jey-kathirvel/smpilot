{% extends "base.html" %}{% block content %}<section class="page-heading"><div><p class="eyebrow">Aria Notifications</p><h1>Notification Center</h1></div><div class="form-actions"><form method="post" action="/notifications/generate"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button>Refresh signals</button></form><form method="post" action="/notifications/read-all"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button>Mark all read</button></form></div></section><section class="card">{% for n in notifications %}<article class="risk-item"><span class="badge">{{ 'Read' if n.read else 'Unread' }}</span><h2>{{ n.title }}</h2><p>{{ n.body }}</p><small>{{ n.type }}</small>{% if not n.read %}<form method="post" action="/notifications/{{ n.id }}/read"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button>Mark read</button></form>{% endif %}</article>{% else %}<p>No notifications.</p>{% endfor %}</section>{% endblock %}
